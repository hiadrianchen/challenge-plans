[project]
name = "challenge-plans"
version = "0.1.2"
description = "Multi-agent adversarial review & deliberation for plans/specs on subscription CLIs (reduce rework before execution)"
readme = "README.md"
authors = [{ name = "Adrian Chen", email = "266411000+hiadrianchen@users.noreply.github.com" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/hiadrianchen/challenge-plans"
Repository = "https://github.com/hiadrianchen/challenge-plans"

[project.scripts]
challenge-plans = "challenge_plans.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/challenge_plans"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
